# Compila el APK de Android en GitHub cada vez que cambia la app
# y lo publica en Releases: https://github.com/Andresaurio5/QRmed/releases/latest/download/QRmed.apk
name: APK Android

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      EXPO_PUBLIC_API_URL: https://qrmed-nik4.onrender.com
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk ../QRmed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QRmed-apk
          path: QRmed.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: QR Médico v1.0.${{ github.run_number }}
          body: |
            APK de QR Médico para Android. Descárgalo e instálalo (permite "orígenes desconocidos" si te lo pide).
          files: QRmed.apk
          make_latest: true
